<body>
<div id="stage"><canvas id="gl" width="1920" height="1080"></canvas><div id="over"></div></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const FACE_ROT = Math.PI / 2, FACE_FLIP = 1;
const C = { black: '#0B1712', acc: '#92CE58', grey: '#E4E7E2', marfil: '#FAF9F5', ink: '#142A22', pend: '#B9C2BE' };
const W = 1920, H = 1080;
const over = document.getElementById('over');
const html = (cls, css, text) => { const d = document.createElement('div'); d.className = cls; d.style.cssText = css; d.innerHTML = text; over.appendChild(d); return d; };

// ------------------------------------------------------------------ renderer
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true });
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const pmrem = new THREE.PMREMGenerator(renderer);
const ENV = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ------------------------------------------------------------------ textures drawn in code
function canvasTex(size, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); draw(g, size);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 8;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// Agent coin face: raised rim, beaded ring, a roof chevron and the name around it (bump map, white = high).
const faceBump = canvasTex(1024, (g, s) => {
  g.fillStyle = '#7a7a7a'; g.fillRect(0, 0, s, s);
  const c = s / 2;
  g.fillStyle = '#ffffff'; g.beginPath(); g.arc(c, c, s * 0.5, 0, 7); g.arc(c, c, s * 0.445, 0, 7, true); g.fill('evenodd');
  for (let i = 0; i < 72; i++) { const a = i / 72 * Math.PI * 2; g.beginPath(); g.arc(c + Math.cos(a) * s * 0.415, c + Math.sin(a) * s * 0.415, 5.5, 0, 7); g.fill(); }
  g.strokeStyle = '#ffffff'; g.lineWidth = 62; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(c - 210, c + 120); g.lineTo(c, c - 95); g.lineTo(c + 210, c + 120); g.stroke();
  g.fillRect(c - 52, c + 40, 104, 104);
  g.font = "600 46px Outfit"; g.textAlign = 'center'; g.textBaseline = 'middle';
  const txt = 'PROPIEDAD · CONECTA · PROPIEDAD · CONECTA · ';
  for (let i = 0; i < txt.length; i++) { const a = -Math.PI / 2 + i / txt.length * Math.PI * 2; g.save(); g.translate(c + Math.cos(a) * s * 0.36, c + Math.sin(a) * s * 0.36); g.rotate(a + Math.PI / 2); g.fillText(txt[i], 0, 0); g.restore(); }
}, false);
// Clock face (colour map) and its bump.
const clockMap = canvasTex(1024, (g, s) => {
  const c = s / 2;
  g.fillStyle = '#1C3A2B'; g.fillRect(0, 0, s, s);
  g.fillStyle = '#2B5A40'; g.beginPath(); g.arc(c, c, s * 0.5, 0, 7); g.arc(c, c, s * 0.445, 0, 7, true); g.fill('evenodd');
  g.strokeStyle = C.marfil; g.lineCap = 'round';
  for (let i = 0; i < 60; i++) { const a = i / 60 * Math.PI * 2, big = i % 5 === 0; g.lineWidth = big ? 16 : 6; g.beginPath(); g.moveTo(c + Math.cos(a) * s * (big ? 0.31 : 0.35), c + Math.sin(a) * s * (big ? 0.31 : 0.35)); g.lineTo(c + Math.cos(a) * s * 0.395, c + Math.sin(a) * s * 0.395); g.stroke(); }
  const hand = (a, len, w, col) => { g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(c, c); g.lineTo(c + Math.cos(a) * len, c + Math.sin(a) * len); g.stroke(); };
  hand(-Math.PI / 2 - 1.05, s * 0.2, 30, C.marfil); hand(-Math.PI / 2 + 1.05, s * 0.29, 20, C.marfil); hand(-Math.PI / 2 + 2.5, s * 0.32, 8, C.acc);
  g.fillStyle = C.acc; g.beginPath(); g.arc(c, c, 26, 0, 7); g.fill();
});
const clockBump = canvasTex(1024, (g, s) => {
  const c = s / 2; g.fillStyle = '#6a6a6a'; g.fillRect(0, 0, s, s);
  g.fillStyle = '#fff'; g.beginPath(); g.arc(c, c, s * 0.5, 0, 7); g.arc(c, c, s * 0.445, 0, 7, true); g.fill('evenodd');
}, false);
// Reeded edge.
const reeding = canvasTex(256, (g, s) => { for (let x = 0; x < s; x += 8) { g.fillStyle = (x / 8) % 2 ? '#ffffff' : '#555555'; g.fillRect(x, 0, 8, s); } }, false);
reeding.wrapS = THREE.RepeatWrapping; reeding.repeat.set(28, 1);
for (const t of [faceBump, clockMap, clockBump]) { t.center.set(0.5, 0.5); t.rotation = FACE_ROT; t.wrapS = THREE.RepeatWrapping; t.repeat.set(FACE_FLIP, 1); }

function coin(kind = 'agente', r = 1) {
  const geo = new THREE.CylinderGeometry(r, r, r * 0.15, 160, 1);
  geo.rotateX(Math.PI / 2);
  const metal = kind === 'agente'
    ? { color: new THREE.Color('#86C94F'), metalness: 1, roughness: 0.3 }
    : { color: new THREE.Color('#2A4A38'), metalness: 0.85, roughness: 0.38 };
  const side = new THREE.MeshPhysicalMaterial({ ...metal, bumpMap: reeding, bumpScale: 1.2, clearcoat: 0.4 });
  const face = kind === 'agente'
    ? new THREE.MeshPhysicalMaterial({ ...metal, bumpMap: faceBump, bumpScale: 4, clearcoat: 0.5, clearcoatRoughness: 0.2 })
    : new THREE.MeshPhysicalMaterial({ color: '#ffffff', map: clockMap, metalness: 0.35, roughness: 0.45, bumpMap: clockBump, bumpScale: 3, clearcoat: 0.6 });
  const back = new THREE.MeshPhysicalMaterial({ ...metal, bumpMap: faceBump, bumpScale: 4, clearcoat: 0.5 });
  const m = new THREE.Mesh(geo, [side, face, back]);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
// A text plane (for words that sit behind 3D objects).
function textPlane(lines, px, color, worldW) {
  const c = document.createElement('canvas'); const g = c.getContext('2d');
  g.font = `800 ${px}px 'Barlow Condensed'`;
  const wpx = Math.max(...lines.map(l => g.measureText(l).width)) + px * 0.2, hpx = lines.length * px * 0.92 + px * 0.25;
  c.width = Math.ceil(wpx); c.height = Math.ceil(hpx);
  g.font = `800 ${px}px 'Barlow Condensed'`; g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'top';
  lines.forEach((l, i) => g.fillText(l, c.width / 2, px * 0.12 + i * px * 0.92));
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(worldW, worldW * c.height / c.width), new THREE.MeshBasicMaterial({ map: t, transparent: true, toneMapped: false }));
  return m;
}
function studio(scene, color) {
  scene.background = new THREE.Color(color);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: 0.16 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  return floor;
}
function keyLight(scene, pos, intensity = 2.2, shadow = true) {
  const l = new THREE.DirectionalLight('#ffffff', intensity); l.position.set(...pos);
  if (shadow) { l.castShadow = true; l.shadow.mapSize.set(2048, 2048); const s = l.shadow.camera; s.left = -12; s.right = 12; s.top = 12; s.bottom = -12; l.shadow.radius = 8; l.shadow.bias = -0.0005; }
  scene.add(l); return l;
}
function rim(scene, pos, color = C.acc, intensity = 6) { const l = new THREE.DirectionalLight(color, intensity); l.position.set(...pos); scene.add(l); return l; }
function finish(scene, camera, { bloom = 0.25, bokeh = null } = {}) {
  const comp = new EffectComposer(renderer);
  comp.setSize(W, H);
  comp.addPass(new RenderPass(scene, camera));
  if (bokeh) comp.addPass(new BokehPass(scene, camera, { focus: bokeh.focus, aperture: bokeh.aperture, maxblur: bokeh.maxblur ?? 0.006 }));
  if (bloom) comp.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), bloom, 0.4, 0.9));
  comp.addPass(new OutputPass());
  comp.render();
}
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

// ------------------------------------------------------------------ frames
const F = {};

// 1 · CARA O CRUZ: the coin toss over black, title behind it.
F[1] = () => {
  const scene = new THREE.Scene(); scene.background = new THREE.Color(C.black); scene.environment = ENV;
  scene.environmentIntensity = 0.55;
  const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100); cam.position.set(0, 0, 12);
  const title = textPlane(['CARA O CRUZ.'], 260, C.acc, 13.2); title.position.set(0, -0.2, -5); scene.add(title);
  const c = coin('agente', 1.25); c.position.set(1.0, 0.55, 2.2); c.rotation.set(-1.0, 0.55, 0.3); scene.add(c);
  // motion ghosts of the flip
  [[0.75, -0.55, 1.4, -0.4], [0.45, -1.45, 0.7, 0.25]].forEach(([x, y, z, rx], i) => {
    const g = coin('agente', 1.25); g.position.set(x, y, z + 2.2); g.rotation.set(rx, 0.5, 0.3);
    g.material.forEach(m => { m.transparent = true; m.opacity = 0.18 - i * 0.07; m.depthWrite = false; }); scene.add(g);
  });
  scene.environmentIntensity = 0.9;
  keyLight(scene, [-4, 5, 8], 2.2, false); rim(scene, [3, 4, -6], C.acc, 3.2); rim(scene, [-5, -2, -4], '#ffffff', 1.2);
  finish(scene, cam, { bloom: 0.18 });
};

// 2 · the machine that swallows coins (agents): grey studio, black machine, green coins pouring in, ? ? ? reels.
F[2] = () => {
  const scene = new THREE.Scene(); scene.environment = ENV; scene.environmentIntensity = 0.7;
  studio(scene, C.grey);
  const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 200); cam.position.set(-1.0, 3.4, 17); cam.lookAt(0.4, 2.9, 0);
  // machine: rounded black block
  const shape = new THREE.Shape(); const w = 4.2, h = 4.6, r = 0.5;
  shape.moveTo(-w / 2 + r, 0); shape.lineTo(w / 2 - r, 0); shape.quadraticCurveTo(w / 2, 0, w / 2, r); shape.lineTo(w / 2, h - r); shape.quadraticCurveTo(w / 2, h, w / 2 - r, h); shape.lineTo(-w / 2 + r, h); shape.quadraticCurveTo(-w / 2, h, -w / 2, h - r); shape.lineTo(-w / 2, r); shape.quadraticCurveTo(-w / 2, 0, -w / 2 + r, 0);
  const body = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 2.6, bevelEnabled: true, bevelSize: 0.08, bevelThickness: 0.08, bevelSegments: 6 }),
    new THREE.MeshPhysicalMaterial({ color: '#0E1D16', metalness: 0.1, roughness: 0.45, clearcoat: 0.6, clearcoatRoughness: 0.3, envMapIntensity: 0.35 }));
  body.position.set(3.7, 0, -1.3); body.castShadow = true; body.receiveShadow = true; scene.add(body);
  // slot on top
  const slot = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.05, 0.28), new THREE.MeshBasicMaterial({ color: '#020504' }));
  slot.position.set(3.7, 4.69, 0); scene.add(slot);
  // reels: three windows with "?"
  const reelTex = canvasTex(256, (g, s) => { g.fillStyle = '#13261C'; g.fillRect(0, 0, s, s); g.fillStyle = C.acc; g.font = "800 190px 'Barlow Condensed'"; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('?', s / 2, s / 2 + 8); });
  for (let i = 0; i < 3; i++) {
    const reel = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 1.15), new THREE.MeshBasicMaterial({ map: reelTex, toneMapped: false }));
    reel.position.set(3.7 + (i - 1) * 1.15, 2.7, 1.39); scene.add(reel);
  }
  const label = textPlane(['PORTALES · PUBLICIDAD'], 90, C.marfil, 3.0); label.position.set(3.7, 1.45, 1.39); scene.add(label);
  // the arc of coins pouring in, then a few that bounced out on the floor
  for (let i = 0; i < 34; i++) {
    const u = i / 33, x = lerp(-7.0, 3.7, u), y = 6.6 - 7.5 * (u - 0.45) ** 2;
    const c = coin('agente', 0.42); c.position.set(x + (rnd() - 0.5) * 0.35, Math.max(y, 4.85) + (rnd() - 0.5) * 0.3, (rnd() - 0.5) * 0.8);
    c.rotation.set(rnd() * 6, rnd() * 6, rnd() * 6); scene.add(c);
  }
  for (const [x, z, ry] of [[1.2, 2.6, 0.4], [2.0, 3.6, 1.9], [0.2, 1.6, 2.7]]) { const c = coin('agente', 0.42); c.position.set(x, 0.033, z); c.rotation.set(Math.PI / 2, 0, ry); scene.add(c); }
  scene.environmentIntensity = 0.45;
  scene.add(new THREE.HemisphereLight('#ffffff', '#cfd4cc', 0.25));
  keyLight(scene, [-6, 12, 9], 1.8); rim(scene, [6, 8, -8], '#ffffff', 1.2);
  finish(scene, cam, { bloom: 0.12 });
  html('t', `left:110px;top:720px;font-size:160px;color:${C.ink}`, '¿FUNCIONARÁ?');
  html('s', `left:116px;top:900px;font-size:40px;color:${C.ink};font-weight:500`, 'Inviertes. Esperas. Cruzas los dedos.');
};

// 3 · the endless feed (seekers): black, receding cards with stamps, clock-coins falling.
F[3] = () => {
  const scene = new THREE.Scene(); scene.background = new THREE.Color(C.black); scene.environment = ENV; scene.environmentIntensity = 0.6;
  scene.fog = new THREE.Fog(C.black, 14, 34);
  const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 200); cam.position.set(0, 0, 14);
  const stamps = ['YA SE ARRENDÓ', 'NO DISPONIBLE', 'SIN RESPUESTA', 'YA SE VENDIÓ', null, null];
  const cardTex = stamp => canvasTex(512, (g, s) => {
    g.fillStyle = '#DADDD8'; roundRect(g, 0, 0, s, s * 1.25 > s ? s : s, 34); g.fill();
    g.fillStyle = '#AEB5AE'; roundRect(g, 26, 26, s - 52, 250, 18); g.fill();
    g.fillStyle = '#C3C9C2'; g.beginPath(); g.moveTo(140, 230); g.lineTo(256, 120); g.lineTo(372, 230); g.fill();
    g.fillStyle = '#9AA39B'; roundRect(g, 26, 305, 300, 34, 10); g.fill(); roundRect(g, 26, 360, 200, 26, 10); g.fill(); roundRect(g, 26, 410, 380, 22, 10); g.fill();
    if (stamp) {
      g.save(); g.translate(s / 2, 300); g.rotate(-0.22);
      g.strokeStyle = C.ink; g.lineWidth = 10; roundRect(g, -220, -58, 440, 116, 14); g.stroke();
      g.fillStyle = C.ink; g.font = "800 74px 'Barlow Condensed'"; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(stamp, 0, 4); g.restore();
    }
  });
  const grid = new THREE.Group(); grid.rotation.set(-0.55, 0.32, 0.12); grid.position.set(1.5, 0.6, -2); scene.add(grid);
  for (let row = -3; row < 7; row++) for (let col = -2; col <= 2; col++) {
    const st = stamps[Math.floor(rnd() * stamps.length)];
    const m = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 2.6), new THREE.MeshStandardMaterial({ map: cardTex(st), roughness: 0.8 }));
    m.position.set(col * 2.9, row * 2.9 + (col % 2) * 1.2, 0); grid.add(m);
  }
  const cs = [[-4.6, 2.6, 4, 0.4], [-2.9, -0.4, 6.5, 1.3], [-5.2, -2.2, 3, 2.1], [-1.6, 3.4, 2, 0.9], [-3.6, 0.9, 8.3, 2.6]];
  for (const [x, y, z, r] of cs) { const c = coin('reloj', 0.62); c.position.set(x, y, z - 4); c.rotation.set(0.25 + r * 0.2, -0.5 + r * 0.3, r); scene.add(c); }
  keyLight(scene, [-4, 6, 10], 1.6, false); rim(scene, [4, 6, -6], C.acc, 5);
  finish(scene, cam, { bloom: 0.14, bokeh: { focus: 13, aperture: 0.0016, maxblur: 0.008 } });
  html('', `position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 18% 75%, rgba(11,23,18,.92), rgba(11,23,18,0) 70%)`, '');
  html('t', `left:110px;top:640px;font-size:170px;color:${C.acc}`, 'DEJA DE REGALAR\nTUS HORAS.');
  html('s', `left:116px;top:960px;font-size:34px;color:${C.marfil};font-weight:500`, 'Horas y horas buscando. Ninguna era la tuya.');
};

// 4 · the fit (seekers): ivory slab with a house-shaped slot; only the right piece goes in.
function houseShape(s = 1, notches = true) {
  const sh = new THREE.Shape();
  const w = 1.25 * s, b = -1.0 * s, top = 0.35 * s, apex = 1.35 * s, n = 0.22 * s;
  sh.moveTo(-w, b); sh.lineTo(w, b);
  if (notches) { sh.lineTo(w, -0.55 * s); sh.lineTo(w - n, -0.55 * s); sh.lineTo(w - n, -0.15 * s); sh.lineTo(w, -0.15 * s); }
  sh.lineTo(w, top); sh.lineTo(0, apex); sh.lineTo(-w, top);
  if (notches) { sh.lineTo(-w, 0.05 * s); sh.lineTo(-w + n * 1.4, 0.05 * s); sh.lineTo(-w + n * 1.4, -0.35 * s); sh.lineTo(-w, -0.35 * s); }
  sh.lineTo(-w, b);
  if (notches) { const hole = new THREE.Path(); hole.moveTo(-0.22 * s, b); }
  return sh;
}
F[4] = () => {
  const scene = new THREE.Scene(); scene.environment = ENV; scene.environmentIntensity = 0.35;
  studio(scene, C.grey);
  const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 200); cam.position.set(1.4, 12.5, 8.2); cam.lookAt(1.4, 0, 0.7);
  const G = new THREE.Group(); G.position.x = 3.3; scene.add(G);
  // slab with the house-shaped slot
  const slab = new THREE.Shape(); slab.moveTo(-3.6, -2.9); slab.lineTo(3.6, -2.9); slab.lineTo(3.6, 3.2); slab.lineTo(-3.6, 3.2); slab.lineTo(-3.6, -2.9);
  slab.holes.push(new THREE.Path(houseShape(1.18).getPoints()));
  const slabMesh = new THREE.Mesh(new THREE.ExtrudeGeometry(slab, { depth: 0.55, bevelEnabled: true, bevelSize: 0.06, bevelThickness: 0.06, bevelSegments: 4 }),
    new THREE.MeshPhysicalMaterial({ color: '#E9E7DF', roughness: 0.7, envMapIntensity: 0.4 }));
  slabMesh.rotation.x = -Math.PI / 2; slabMesh.castShadow = true; slabMesh.receiveShadow = true; G.add(slabMesh);
  const pts = houseShape(1.2).getPoints(); pts.push(pts[0]);
  G.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p.x, 0.63, -p.y)), true, 'catmullrom', 0), 400, 0.035, 8, true),
    new THREE.MeshBasicMaterial({ color: C.acc, toneMapped: false })));
  // the right piece, tilted, about to drop in
  const piece = new THREE.Mesh(new THREE.ExtrudeGeometry(houseShape(1.15), { depth: 0.5, bevelEnabled: true, bevelSize: 0.03, bevelThickness: 0.03, bevelSegments: 3 }),
    new THREE.MeshPhysicalMaterial({ color: '#7FC24B', metalness: 0.55, roughness: 0.32, clearcoat: 0.6, envMapIntensity: 0.8 }));
  piece.rotation.set(-Math.PI / 2 + 0.32, 0.1, -0.12); piece.position.set(0.55, 2.1, 0.9); piece.castShadow = true; G.add(piece);
  // wrong pieces, tossed on the floor
  const wrong = (shape, x, z, rz) => { const m = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.4, bevelEnabled: true, bevelSize: 0.03, bevelThickness: 0.03 }), new THREE.MeshPhysicalMaterial({ color: '#AEB6B0', roughness: 0.6, envMapIntensity: 0.4 })); m.rotation.set(-Math.PI / 2, 0, rz); m.position.set(x, 0.02, z); m.castShadow = true; scene.add(m); };
  wrong(houseShape(0.75, false), -3.2, 4.6, 0.6);
  wrong(houseShape(1.0, false), 8.2, -0.6, -0.5);
  scene.add(new THREE.HemisphereLight('#ffffff', '#cfd4cc', 0.25));
  keyLight(scene, [-5, 12, 6], 1.9); rim(scene, [6, 6, -8], C.acc, 1.5);
