<!doctype html>

<title>Nuevas reglas · 40 s</title>
<!--
  «Nuevas reglas»: 40 s launch film (docs/lanzamiento/idea.md). Three.js (MIT) shared from video/monedas/vendor/.
  Every frame is a pure function of time: draw(t). 120 BPM grid: one beat = 0.5 s, one bar = 2 s, cuts on bar lines.
  Render: node video/render.mjs --gl --page video/lanzamiento/index.html … (see video/lanzamiento/README.md).
  Every game piece is drawn in code; the only brand asset is the real logo.
-->
<style>
  @font-face { font-family: Outfit; src: url(../../anuncios/reel-publica-tu-busqueda/animatic/fuentes/Outfit-Variable.ttf) format('truetype'); font-weight: 100 900; }

  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0B1712; font-family: Outfit, sans-serif; }

  .s { font-weight: 500; white-space: pre; }
  .rule { font-weight: 700; font-size: 26px; letter-spacing: .16em; padding: 10px 20px 9px; border-radius: 8px; white-space: nowrap; }
  .bubble { font-size: 30px; font-weight: 600; color: #142A22; background: #fff; padding: 18px 28px; border-radius: 26px 26px 26px 6px; box-shadow: 0 14px 34px rgba(11,23,18,.18); white-space: nowrap; transform-origin: 0% 100%; }

<div id="stage"><canvas id="gl" width="1920" height="1080"></canvas><div id="over"></div></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { HorizontalTiltShiftShader } from 'three/addons/shaders/HorizontalTiltShiftShader.js';
import { VerticalTiltShiftShader } from 'three/addons/shaders/VerticalTiltShiftShader.js';

// ------------------------------------------------------------------ constants & helpers
const W = 1920, H = 1080, DURATION = 40, B = 0.5, BAR = 4 * B;
const C = { black: '#0B1712', acc: '#92CE58', grey: '#E4E7E2', marfil: '#FAF9F5', ink: '#142A22', seek: '#2E5A40', piece: '#B9C2BE' };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const expoOut = x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const expoIn = x => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10));
const inOut = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const smooth = x => x * x * (3 - 2 * x);
const backOut = (x, s = 1.4) => { x = clamp(x); const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const beat = n => n * B;
const hash = i => { let h = Math.imul(i + 1, 2654435761) ^ 0x9e3779b9; h = Math.imul(h ^ (h >>> 15), 2246822519); return ((h ^ (h >>> 13)) >>> 0) / 4294967295; };
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const bounce = (q, amp, k = 16, d = 7) => (q > 0 ? Math.abs(Math.sin(q * k)) * amp * Math.exp(-q * d) : 0);

// ------------------------------------------------------------------ renderer
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const ENV = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

// ------------------------------------------------------------------ overlays (DOM)
const over = document.getElementById('over');
const O = [];
function ov(cls, css, html) { const d = document.createElement('div'); d.className = 'o ' + cls; d.style.cssText += css; d.innerHTML = html; over.appendChild(d); O.push(d); return d; }
function showO(d, op = 1, extra = '') { d.style.display = op > 0.001 ? 'block' : 'none'; d.style.opacity = op; d.style.transform = extra; }
function screenOf(v, cam) { const p = v.clone().project(cam); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H]; }
// a title that rises 24 px into place while it fades in
function rise(d, t, t0, t1 = 99) { const q = ramp(t, t0, t0 + 0.35); const out = 1 - smooth(ramp(t, t1 - 0.2, t1)); showO(d, smooth(q) * out, `translateY(${(1 - expoOut(q)) * 24}px)`); }

// ------------------------------------------------------------------ textures drawn in code
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function tex(c, srgb = true) { const t = new THREE.CanvasTexture(c); t.anisotropy = 8; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; }
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

let coinMats, listingPlain, listingStamped, stampTex, adTex, cardTex;
function makeTextures() {
  // the agent's coin (same coin as «Monedas al aire»)
  const c1 = canvas(1024, 1024), g = c1.getContext('2d'), s = 1024, c = 512;
  g.fillStyle = '#7a7a7a'; g.fillRect(0, 0, s, s);
  g.fillStyle = '#fff'; g.beginPath(); g.arc(c, c, s * 0.5, 0, 7); g.arc(c, c, s * 0.445, 0, 7, true); g.fill('evenodd');
  for (let i = 0; i < 72; i++) { const a = i / 72 * Math.PI * 2; g.beginPath(); g.arc(c + Math.cos(a) * s * 0.415, c + Math.sin(a) * s * 0.415, 5.5, 0, 7); g.fill(); }
  g.strokeStyle = '#fff'; g.lineWidth = 62; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(c - 210, c + 120); g.lineTo(c, c - 95); g.lineTo(c + 210, c + 120); g.stroke();
  g.fillRect(c - 52, c + 40, 104, 104);
  g.font = '600 46px Outfit'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const txt = 'PROPIEDAD · CONECTA · PROPIEDAD · CONECTA · ';
  for (let i = 0; i < txt.length; i++) { const a = -Math.PI / 2 + i / txt.length * Math.PI * 2; g.save(); g.translate(c + Math.cos(a) * s * 0.36, c + Math.sin(a) * s * 0.36); g.rotate(a + Math.PI / 2); g.fillText(txt[i], 0, 0); g.restore(); }
  const faceBump = tex(c1, false);
  const c3 = canvas(256, 256), r = c3.getContext('2d');
  for (let x = 0; x < 256; x += 8) { r.fillStyle = (x / 8) % 2 ? '#fff' : '#555'; r.fillRect(x, 0, 8, 256); }
  const reeding = tex(c3, false); reeding.wrapS = THREE.RepeatWrapping; reeding.repeat.set(28, 1);
  const M = { color: new THREE.Color('#86C94F'), metalness: 1, roughness: 0.3 };
  coinMats = [
    new THREE.MeshPhysicalMaterial({ ...M, bumpMap: reeding, bumpScale: 1.2, clearcoat: 0.4 }),
    new THREE.MeshPhysicalMaterial({ ...M, bumpMap: faceBump, bumpScale: 4, clearcoat: 0.5, clearcoatRoughness: 0.2 }),
    new THREE.MeshPhysicalMaterial({ ...M, bumpMap: faceBump, bumpScale: 4, clearcoat: 0.5 }),
  ];
  // a listing square of the old board
  const listing = stamp => {
    const k = canvas(512, 512), q = k.getContext('2d');
    q.fillStyle = '#DADDD8'; q.fillRect(0, 0, 512, 512);
    q.fillStyle = '#AEB5AE'; roundRect(q, 34, 34, 444, 250, 18); q.fill();
    q.fillStyle = '#C6CCC5'; q.beginPath(); q.moveTo(150, 230); q.lineTo(256, 120); q.lineTo(362, 230); q.fill(); q.fillRect(180, 222, 152, 40);
    q.fillStyle = '#9AA39B'; roundRect(q, 34, 316, 300, 34, 10); q.fill(); roundRect(q, 34, 372, 200, 26, 10); q.fill(); roundRect(q, 34, 420, 380, 22, 10); q.fill();
    if (stamp) stampOn(q, stamp, 256, 300);
    return tex(k);
  };
  const stampOn = (q, word, x, y) => { q.save(); q.translate(x, y); q.rotate(-0.22); q.strokeStyle = C.ink; q.lineWidth = 11; roundRect(q, -226, -60, 452, 120, 14); q.stroke(); q.fillStyle = C.ink; q.font = "800 76px 'Barlow Condensed'"; q.textAlign = 'center'; q.textBaseline = 'middle'; q.fillText(word, 0, 4); q.restore(); };
  listingPlain = listing(null);
  listingStamped = ['YA SE ARRENDÓ', 'NO DISPONIBLE', 'SIN RESPUESTA', 'YA SE VENDIÓ'].map(listing);
  stampTex = ['NO DISPONIBLE', 'YA SE ARRENDÓ', 'SIN RESPUESTA', 'YA SE VENDIÓ'].map(w => { const k = canvas(512, 256), q = k.getContext('2d'); stampOn(q, w, 256, 128); return tex(k); });
  // the billboard's generic ad
  const a = canvas(1024, 560), h = a.getContext('2d');
  h.fillStyle = '#13261C'; h.fillRect(0, 0, 1024, 560);
  h.fillStyle = '#1F3A2B'; roundRect(h, 40, 40, 440, 480, 24); h.fill();
  h.fillStyle = '#2E5240'; h.beginPath(); h.moveTo(110, 330); h.lineTo(260, 190); h.lineTo(410, 330); h.fill(); h.fillRect(150, 320, 220, 130);
  h.fillStyle = C.marfil; h.font = "800 92px 'Barlow Condensed'"; h.textBaseline = 'top'; h.fillText('PORTALES', 530, 110); h.fillText('PUBLICIDAD', 530, 210);
  h.fillStyle = C.acc; h.font = "800 140px 'Barlow Condensed'"; h.fillText('? ? ?', 530, 320);
  adTex = tex(a);
  // the request card
  const k = canvas(700, 900), q = k.getContext('2d');
  q.fillStyle = '#FFFFFF'; roundRect(q, 0, 0, 700, 900, 40); q.fill();
  q.fillStyle = C.acc; roundRect(q, 0, 0, 700, 150, 40); q.fill(); q.fillRect(0, 100, 700, 50);
  q.fillStyle = C.black; q.font = "800 96px 'Barlow Condensed'"; q.textBaseline = 'middle'; q.fillText('BUSCO', 56, 80);
  const row = (y, t) => { q.fillStyle = C.ink; q.font = '600 58px Outfit'; q.fillText(t, 56, y); q.fillStyle = '#E4E7E2'; q.fillRect(56, y + 50, 588, 3); };
  row(250, 'Departamento'); row(380, '3 habitaciones'); row(510, '2 baños'); row(640, 'Con parqueadero');
  q.fillStyle = '#5E6B64'; q.font = '500 40px Outfit'; q.fillText('Publicado gratis', 56, 800);
  cardTex = tex(k);
}

// ------------------------------------------------------------------ game pieces
function coin(r = 1) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, r * 0.15, 120, 1), coinMats); m.castShadow = true; m.receiveShadow = true; return m; }
function slab(w, d, h, r, mats) {   // rounded tile, top face up, planar UVs on the top
  const sh = new THREE.Shape(); sh.moveTo(-w / 2 + r, -d / 2); sh.lineTo(w / 2 - r, -d / 2); sh.quadraticCurveTo(w / 2, -d / 2, w / 2, -d / 2 + r); sh.lineTo(w / 2, d / 2 - r); sh.quadraticCurveTo(w / 2, d / 2, w / 2 - r, d / 2); sh.lineTo(-w / 2 + r, d / 2); sh.quadraticCurveTo(-w / 2, d / 2, -w / 2, d / 2 - r); sh.lineTo(-w / 2, -d / 2 + r); sh.quadraticCurveTo(-w / 2, -d / 2, -w / 2 + r, -d / 2);
  const geo = new THREE.ExtrudeGeometry(sh, { depth: h, bevelEnabled: true, bevelSize: Math.min(0.04, r * 0.5), bevelThickness: 0.03, bevelSegments: 3, curveSegments: 6 });
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, (pos.getX(i) + w / 2) / w, (pos.getY(i) + d / 2) / d);
  geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, mats); m.castShadow = true; m.receiveShadow = true; return m;
}
const tileSide = () => new THREE.MeshPhysicalMaterial({ color: '#CDD2CB', roughness: 0.6, envMapIntensity: 0.4 });
const tileMats = new Map();
function tile(t, s = 1.6) {
  if (!tileMats.has(t)) tileMats.set(t, [new THREE.MeshPhysicalMaterial({ map: t, roughness: 0.55, clearcoat: 0.3, envMapIntensity: 0.4 }), tileSide()]);
  return slab(s, s, 0.12, 0.12, tileMats.get(t));
}
// pawn; head(): the group is centred on the head, so it can become a head of the logo
function pawn(color = C.seek, s = 1, head = false) {
  const p = [[0, 0], [0.42, 0], [0.44, 0.05], [0.42, 0.11], [0.3, 0.16], [0.22, 0.22], [0.16, 0.5], [0.13, 0.7], [0.22, 0.74], [0.23, 0.79], [0.12, 0.83], [0, 0.84]].map(([x, y]) => new THREE.Vector2(x * s, y * s));
  const mat = new THREE.MeshPhysicalMaterial({ color, metalness: 0.15, roughness: 0.28, clearcoat: 0.9, clearcoatRoughness: 0.12, envMapIntensity: 0.7 });
  const g = new THREE.Group(), inner = new THREE.Group(); g.add(inner);
  const bodyMat = mat.clone();
  const body = new THREE.Mesh(new THREE.LatheGeometry(p, 64), bodyMat); body.castShadow = true; body.receiveShadow = true; inner.add(body);
  const hd = new THREE.Mesh(new THREE.SphereGeometry(0.25 * s, 48, 32), mat); hd.position.y = 1.04 * s; hd.castShadow = true; inner.add(hd);
  if (head) inner.position.y = -1.04 * s;
  g.userData = { mat, bodyMat, body, headR: 0.25 * s };
  return g;
}
function houseShape(s = 1) { const sh = new THREE.Shape(); sh.moveTo(-0.6 * s, 0); sh.lineTo(0.6 * s, 0); sh.lineTo(0.6 * s, 0.7 * s); sh.lineTo(0, 1.2 * s); sh.lineTo(-0.6 * s, 0.7 * s); sh.lineTo(-0.6 * s, 0); return sh; }
function house(s = 1) {
  const mat = new THREE.MeshPhysicalMaterial({ color: '#CFD3CC', roughness: 0.55, clearcoat: 0.3, envMapIntensity: 0.45, emissive: new THREE.Color('#2c5a12'), emissiveIntensity: 0 });
  const m = new THREE.Mesh(new THREE.ExtrudeGeometry(houseShape(s), { depth: 1.0 * s, bevelEnabled: true, bevelSize: 0.05 * s, bevelThickness: 0.05 * s, bevelSegments: 3 }), mat);
  m.geometry.translate(0, 0, -0.5 * s); m.castShadow = true; m.receiveShadow = true;
  const doorMat = new THREE.MeshBasicMaterial({ color: '#8D968E' });
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.26 * s, 0.42 * s, 0.02), doorMat); door.position.set(0, 0.21 * s, 0.56 * s); m.add(door);
  m.userData = { mat, doorMat };
  return m;
}
// light a house: 0 grey → 1 Brote
function lightHouse(h, k) {
  const { mat, doorMat } = h.userData;
  mat.color.set('#CFD3CC').lerp(new THREE.Color('#7FC24B'), k); mat.metalness = 0.55 * k; mat.roughness = lerp(0.55, 0.3, k); mat.emissiveIntensity = 0.35 * k;
  doorMat.color.set('#8D968E').lerp(new THREE.Color('#1E3A12'), k);
}
// the game timer: setFill(f) drains the top into the bottom; flow(on) shows the stream
function hourglass(s = 1) {
  const g = new THREE.Group();
  const capMat = new THREE.MeshPhysicalMaterial({ color: '#173326', roughness: 0.35, clearcoat: 0.8, envMapIntensity: 0.6 });
  for (const y of [0, 2.3]) { const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.78, 0.78, 0.14, 64), capMat); cap.position.y = y + 0.07; cap.castShadow = true; g.add(cap); }
  for (let i = 0; i < 3; i++) { const a = i / 3 * Math.PI * 2 + 0.5; const post = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 2.2, 16), capMat); post.position.set(Math.cos(a) * 0.66, 1.22, Math.sin(a) * 0.66); post.castShadow = true; g.add(post); }
  const prof = [[0.05, 0.14], [0.42, 0.2], [0.57, 0.45], [0.5, 0.82], [0.2, 1.08], [0.06, 1.22], [0.2, 1.36], [0.5, 1.62], [0.57, 1.99], [0.42, 2.24], [0.05, 2.3]];
  g.add(new THREE.Mesh(new THREE.LatheGeometry(prof.map(([r, y]) => new THREE.Vector2(r, y)), 64), new THREE.MeshPhysicalMaterial({ color: '#ffffff', roughness: 0.04, transparent: true, opacity: 0.16, clearcoat: 1, envMapIntensity: 1.4, side: THREE.DoubleSide, depthWrite: false })));
  const rad = y => { for (let i = 1; i < prof.length; i++) if (y <= prof[i][1]) { const [r0, y0] = prof[i - 1], [r1, y1] = prof[i]; return lerp(r0, r1, (y - y0) / (y1 - y0)); } return 0.05; };
  const sand = new THREE.MeshPhysicalMaterial({ color: C.acc, roughness: 0.85, emissive: new THREE.Color('#3d6e1d'), emissiveIntensity: 0.25 });
  const topPts = [new THREE.Vector2(0, 0)]; for (let y = 1.25; y <= 2.06; y += 0.04) topPts.push(new THREE.Vector2(Math.max(0.02, rad(y) - 0.05), y - 1.25)); topPts.push(new THREE.Vector2(0, 0.81));
  const top = new THREE.Mesh(new THREE.LatheGeometry(topPts, 48), sand); top.position.y = 1.25; g.add(top);
  const pile = new THREE.Mesh(new THREE.LatheGeometry([[0, 0], [0.5, 0.02], [0.52, 0.12], [0.28, 0.42], [0, 0.55]].map(([r, y]) => new THREE.Vector2(r, y)), 48), sand); pile.position.y = 0.14; g.add(pile);
  const stream = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 1, 8), sand); g.add(stream);
  g.traverse(o => { if (o.isMesh && o.material !== undefined && !o.material.transparent) o.castShadow = true; });
  g.scale.setScalar(s);
  g.userData = {
    setFill(f) { top.scale.y = Math.max(0.02, f); top.visible = f > 0.02; pile.scale.set(1, 0.15 + 0.85 * (1 - f), 1); const ph = 0.14 + 0.55 * pile.scale.y; stream.scale.y = 1.22 - ph; stream.position.y = (1.22 + ph) / 2; },
    flow(on) { stream.visible = on; },
  };
  return g;
}
function tube(points, r, color, closed = false) {
  const geo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points, closed, 'catmullrom', 0.5), 300, r, 8, closed);
  return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, toneMapped: false, transparent: true }));
}
function ring(r, w, color, opacity = 1) { const m = new THREE.Mesh(new THREE.TorusGeometry(r, w, 8, 128), new THREE.MeshBasicMaterial({ color, transparent: true, opacity, toneMapped: false })); m.rotation.x = Math.PI / 2; return m; }

// ------------------------------------------------------------------ scene helpers
function studio(scene, color, opacity = 0.16) {
  scene.background = new THREE.Color(color);
  const f = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.ShadowMaterial({ opacity }));
  f.rotation.x = -Math.PI / 2; f.receiveShadow = true; scene.add(f); return f;
}
function keyLight(scene, pos, intensity = 2, shadow = true, span = 14) {
  const l = new THREE.DirectionalLight('#ffffff', intensity); l.position.set(...pos);
  if (shadow) { l.castShadow = true; l.shadow.mapSize.set(2048, 2048); Object.assign(l.shadow.camera, { left: -span, right: span, top: span, bottom: -span, far: 120 }); l.shadow.radius = 6; l.shadow.bias = -0.0006; }
  scene.add(l); return l;
}
const rim = (scene, pos, color = C.acc, i = 3) => { const l = new THREE.DirectionalLight(color, i); l.position.set(...pos); scene.add(l); return l; };
function composer(scene, cam, { bloom = 0.15, tilt = 0, band = 0.5 } = {}) {
  const comp = new EffectComposer(renderer); comp.setSize(W, H);
  comp.addPass(new RenderPass(scene, cam));
  if (tilt) for (let i = 0; i < 2; i++) {
    const h = new ShaderPass(HorizontalTiltShiftShader); h.uniforms.h.value = tilt / W; h.uniforms.r.value = band; comp.addPass(h);
    const v = new ShaderPass(VerticalTiltShiftShader); v.uniforms.v.value = tilt / H; v.uniforms.r.value = band; comp.addPass(v);
  }
  if (bloom) comp.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), bloom, 0.4, 0.9));
  comp.addPass(new OutputPass());
  return comp;
}

// ------------------------------------------------------------------ scenes
const S = {};

// shots 1-2 (0-10 s): the old board lays itself out; the pawn hops square after square; the timer drains
function buildOld() {
  const scene = new THREE.Scene(); scene.environment = ENV; scene.environmentIntensity = 0.55;
  studio(scene, C.black, 0.35); scene.fog = new THREE.Fog(C.black, 18, 52);
  const cam = new THREE.PerspectiveCamera(28, W / H, 0.1, 200);
  const path = new THREE.CatmullRomCurve3([[-9, 0, 9], [-2, 0, 6], [5, 0, 5.5], [8, 0, 1], [3, 0, -2], [-5, 0, -3], [-7, 0, -9], [0, 0, -13], [9, 0, -15], [12, 0, -24], [2, 0, -30], [-8, 0, -36]].map(p => V3(...p)));
  const N = 64, pts = path.getSpacedPoints(N);
  const STAMP_AT = { 9: 0, 11: 1, 12: 2, 14: 3, 16: 0, 17: 1, 19: 2 };   // hop target → stamp word
  const tiles = pts.slice(0, N).map((p, i) => {
    const t = tile(i > 22 && i % 3 === 1 ? listingStamped[i % 4] : listingPlain);
    const tg = path.getTangentAt(i / N); t.rotation.y = Math.atan2(tg.x, tg.z) + Math.PI / 2; t.position.copy(p); scene.add(t);
    let stamp = null;
    if (STAMP_AT[i] !== undefined) {
      stamp = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 0.65), new THREE.MeshBasicMaterial({ map: stampTex[STAMP_AT[i]], transparent: true, depthWrite: false }));
      stamp.rotation.x = -Math.PI / 2; stamp.position.y = 0.17; t.add(stamp);
    }
    return { t, p, td: 0.1 + i * 0.042, stamp };
  });
  const pw = pawn(C.seek, 1.05); scene.add(pw);

  T.juego = ov('t', `left:0;width:1920px;text-align:center;top:470px;font-size:170px;color:${C.marfil}`, 'EL JUEGO DE SIEMPRE.');
  T.gradOld = ov('', `left:0;top:0;width:1920px;height:1080px;background:linear-gradient(0deg, rgba(11,23,18,.85) 0%, rgba(11,23,18,0) 38%)`, '');
  T.rule1 = ov('rule', `left:112px;top:772px;background:${C.acc};color:${C.black}`, 'REGLA DE SIEMPRE · SI BUSCAS CASA');
  T.horas = ov('t', `left:110px;top:828px;font-size:150px;color:${C.marfil}`, 'PIERDES HORAS BUSCANDO.');
  T.rule2 = ov('rule', `left:112px;top:128px;background:${C.ink};color:${C.marfil}`, 'REGLA DE SIEMPRE · SI ERES AGENTE');
  T.dinero = ov('t', `left:110px;top:184px;font-size:128px;color:${C.ink}`, 'INVIERTES DINERO\nY CRUZAS LOS DEDOS.');
  T.dinero2 = ov('s', `left:116px;top:430px;font-size:36px;color:${C.ink}`, 'Portales y publicidad que no te prometen nada.');
  T.nuevas = ov('t', `left:0;width:1920px;text-align:center;top:770px;font-size:230px;color:${C.acc}`, 'NUEVAS REGLAS.');
  T.rule3 = ov('rule', `left:112px;top:128px;background:${C.acc};color:${C.black}`, 'NUEVA REGLA · SI BUSCAS CASA');
  T.publicas = ov('t', `left:110px;top:184px;font-size:136px;color:${C.ink}`, 'PUBLICAS GRATIS\nLO QUE NECESITAS.');
  T.trabajan = ov('t', `left:110px;top:184px;font-size:136px;color:${C.ink}`, 'DEJA QUE LOS AGENTES\nTRABAJEN POR TI.');
  T.rule4 = ov('rule', `left:112px;top:128px;background:${C.ink};color:${C.marfil}`, 'NUEVA REGLA · SI ERES AGENTE');
  T.prospectos = ov('t', `left:110px;top:184px;font-size:88px;color:${C.ink}`, 'INVIERTES SOLO EN\nPROSPECTOS QUE ENCAJAN\nCON LO QUE TIENES.');
  T.tiempo = ov('t', `left:${960 - 2.0 * 167.9 - 360}px;width:720px;text-align:center;top:840px;font-size:84px;color:${C.marfil}`, 'DEJA DE REGALAR\nTU TIEMPO.');
  T.ciegas = ov('t', `left:${960 + 2.0 * 167.9 - 360}px;width:720px;text-align:center;top:840px;font-size:84px;color:${C.acc}`, 'DEJA DE INVERTIR\nA CIEGAS.');
  T.end = ov('', `left:0;top:0;width:1920px;height:1080px;background:${C.marfil}`, `<img src="../../anuncios/reel-publica-tu-busqueda/marca/logo-horizontal-transparente.png" style="position:absolute;left:557px;top:230px;width:806px;height:287px">`);
  T.slogan = ov('t', `left:0;width:1920px;text-align:center;top:600px;font-size:96px;color:${C.ink}`, 'TÚ BUSCAS. NOSOTROS CONECTAMOS.');
  T.sub = ov('s', `left:0;width:1920px;text-align:center;top:735px;font-size:38px;color:${C.ink}`, 'Publica gratis lo que buscas: el agente que lo tiene, te contacta.');
  T.url = ov('s', `left:0;width:1920px;text-align:center;top:880px;font-size:30px;letter-spacing:.06em;color:${C.ink}`, 'propiedadconecta.com');
}

// ------------------------------------------------------------------ timeline (beats; one beat = 0.5 s)
const SHOTS = [
  [0, 20, t => run(S.old, t)],                 // 1-2 · the old board, the hops (0-10 s)
  [20, 32, t => run(S.ad, t - 10)],            // 3 · money into the billboard (10-16 s)
  [32, 36, t => run(S.flip, t - 16)],          // 4 · NUEVAS REGLAS (16-18 s)
  [36, 60, t => run(S.nuevo, t)],              // 5-6 · the new rules (18-30 s)
  [60, 68, t => run(S.payoff, t - 30)],        // 7 · the payoff (30-34 s)
  [68, 81, () => {}],                          // 8 · end card (DOM only)
];
function run(s, lt) { s.update(lt); s.comp.render(); }

function overlays(t) {
  if (t >= 1.0 && t < 4.0) { const a = smooth(ramp(t, 1.0, 1.3)) * (1 - smooth(ramp(t, 3.6, 3.95))); showO(T.vigOld, a); showO(T.juego, a, `scale(${lerp(1.06, 1, expoOut(ramp(t, 1.0, 1.6)))})`); }
  if (t >= 5.0 && t < 10) { showO(T.gradOld, smooth(ramp(t, 4.8, 5.2))); rise(T.rule1, t, 5.0); rise(T.horas, t, 5.15); }
  if (t >= 11 && t < 16) { rise(T.rule2, t, 11.0); rise(T.dinero, t, 11.15); rise(T.dinero2, t, 12.0); }
  if (t >= 16.5 && t < 18) { const q = ramp(t, 16.5, 16.75); showO(T.nuevas, smooth(q), `scale(${lerp(1.35, 1, expoOut(q))})`); }
  if (t >= 18.5 && t < 24) { rise(T.rule3, t, 18.5); }
  if (t >= 18.65 && t < 21) rise(T.publicas, t, 18.65, 21.0);
  if (t >= 21.0 && t < 24) rise(T.trabajan, t, 21.05);
  if (t >= 24.5 && t < 30) { rise(T.rule4, t, 24.5); rise(T.prospectos, t, 24.65); }
  if (t >= 30.3 && t < 32.6) { rise(T.tiempo, t, 30.3, 32.6); }
  if (t >= 31.3 && t < 32.6) { rise(T.ciegas, t, 31.3, 32.6); }
  // the pieces land on the logo's heads at 33.3 s; the ivory card and the real logo fade in over them
  if (t >= 33.3) showO(T.end, smooth(ramp(t, 33.3, 33.6)));
  if (t >= 34.5) rise(T.slogan, t, 34.5);
  if (t >= 35.3) rise(T.sub, t, 35.3);
  if (t >= 35.9) showO(T.url, smooth(ramp(t, 35.9, 36.3)));
}

function draw(t) {
  t = clamp(t, 0, DURATION - 1e-6);
  for (const d of O) d.style.display = 'none';            // scenes and overlays() re-show what they need
  for (const [a, b, f] of SHOTS) if (t >= beat(a) && t < beat(b)) { f(t); break; }
  overlays(t);
}

// ------------------------------------------------------------------ boot
window.READY = false; window.draw = draw;
(async () => {
  await Promise.all([document.fonts.load("800 200px 'Barlow Condensed'"), document.fonts.load('600 40px Outfit'), document.fonts.load('500 40px Outfit'), document.fonts.load('700 40px Outfit')]);
  makeTextures();
  buildOld(); buildAd(); buildFlip(); buildNew(); buildPayoff(); buildOverlays();
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  for (const t of [1, 6, 12, 17, 20, 27, 31]) draw(t);    // compile every scene's shaders once
  window.READY = true;
  const q = new URLSearchParams(location.search);
  if (q.has('render')) { draw(0); return; }
  document.body.classList.add('preview');
  const st = document.getElementById('stage'); const fit = () => { st.style.transform = `scale(${Math.min(innerWidth / W, innerHeight / H)})`; }; fit(); addEventListener('resize', fit);
  if (q.has('t')) { draw(parseFloat(q.get('t'))); return; }
  let t0 = performance.now(), paused = false, pt = 0;
  addEventListener('click', () => { paused = !paused; if (!paused) t0 = performance.now() - pt * 1000; });
  const loop = now => { if (!paused) { pt = ((now - t0) / 1000) % DURATION; draw(pt); } requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
})();
</script>
